name: Windows diagnostic pilot (CI-1)

on:
  workflow_dispatch:
    inputs:
      offline_prototype_only:
        description: Test offline integration; upload first-party tools only (no VLC or runtime)
        type: boolean
        default: false
      portable_dependency_only:
        description: Test startup Vulkan diagnostics only; no VLC build/runtime download
        type: boolean
        default: false
      stage:
        description: Pinned diagnostic source (Stage 2.4.3 remains the default)
        type: choice
        options: ['2.4.3', '2.4.4', '2.4.5', '2.4.6A', '2.4.6B', '2.4.6C', '2.4.6D', '2.4.6E', '2.4.6F']
        default: '2.4.3'

      benchmark_only:
        description: Stage 2.4.5 helper-only timing experiment (no VLC rebuild/package)
        type: boolean
        default: false

      native_only:
        description: Retest an existing Stage 2.4.6B package without rebuilding VLC
        type: boolean
        default: false
      package_run_id:
        description: Existing successful Stage 2.4.6B build run ID (required for native_only)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.offline_prototype_only && !inputs.portable_dependency_only && inputs.stage != '2.4.6A' && !inputs.native_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VLC_CI_STAGE: ${{ inputs.stage || '2.4.3' }}
      VLC_CI_BENCHMARK_ONLY: ${{ inputs.benchmark_only && 'true' || 'false' }}
      SOURCE_SHA: ${{ inputs.stage == '2.4.6F' && 'e29d1dc98c01e64de60de0fe2f299acd2af57aca' || inputs.stage == '2.4.6E' && 'e577355ed22aea9d2703aad794f79a68f0a1ce42' || inputs.stage == '2.4.6D' && '12b25af9272193ddfd0c298e1e9f48c5ff5b66e4' || inputs.stage == '2.4.6C' && 'febfd332f4ffbc94981f0b1cac298dc941de057b' || inputs.stage == '2.4.6B' && '5cfebdb9718b3477e17c5ffcb6d14a2876974350' || inputs.stage == '2.4.5' && 'd10df7f0a54326f122f54b2a2961a3e1b0ee1f66' || inputs.stage == '2.4.4' && 'e879ce656c218eddec13926f03b5f0615d14dc61' || '2f7cb820e893c8dc53e40cddbab9c57a2fe1a0fc' }}
    steps:
      - name: Set run-specific output directory
        shell: bash
        run: echo "CI_WORK=$RUNNER_TEMP/vlc-ci1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Check out CI driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-driver
          persist-credentials: false
      - name: Check out pinned application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare, test, build and package
        shell: bash
        run: bash ci-driver/ci/windows/build-diagnostic.sh run "$GITHUB_WORKSPACE/source" "$CI_WORK"
      - name: Upload synthetic Stage E Qt render
        if: ${{ inputs.stage == '2.4.6E' && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage246E-visual-renders-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_WORK }}/qt-tests/preview-*.png
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Upload pilot package
        if: ${{ !inputs.benchmark_only }}
        id: package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vlc-stage${{ inputs.stage == '2.4.6F' && '246F' || inputs.stage == '2.4.6E' && '246E' || inputs.stage == '2.4.6D' && '246D' || inputs.stage == '2.4.6C' && '246C' || inputs.stage == '2.4.6B' && '246B' || inputs.stage == '2.4.5' && '245' || inputs.stage == '2.4.4' && '244' || '243' }}-win64-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_WORK }}/delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: false
      - name: Download pilot for independent readback
        if: ${{ !inputs.benchmark_only }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.package.outputs.artifact-id }}
          path: ${{ env.CI_WORK }}/readback
          merge-multiple: true
      - name: Verify downloaded ZIP against producer manifest
        if: ${{ !inputs.benchmark_only }}
        shell: bash
        run: >-
          python3 ci-driver/ci/windows/package-diagnostic.py verify
          "$CI_WORK/readback" --expected-manifest "$CI_WORK/delivery/PACKAGE_MANIFEST.json"
      - name: Prepare single-extraction portable download
        if: ${{ inputs.stage == '2.4.6F' && !inputs.benchmark_only }}
        shell: bash
        run: |
          python3 - "$CI_WORK" <<'PYTHON'
          import json, pathlib, sys, zipfile
          work = pathlib.Path(sys.argv[1])
          manifest = json.loads((work / 'delivery/PACKAGE_MANIFEST.json').read_text())
          # The preceding verifier checks every member, path, CRC and hash.
          with zipfile.ZipFile(work / 'delivery' / manifest['zip']) as archive:
              archive.extractall(work / 'portable-ready')
          PYTHON
      - name: Upload ready-to-extract portable edition
        if: ${{ inputs.stage == '2.4.6F' && !inputs.benchmark_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VLC-Timeline-Preview-Stage-246F-Portable-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_WORK }}/portable-ready/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
          overwrite: false
      - name: Final resource and container measurements
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          if [[ -f ci-driver/ci/windows/build-diagnostic.sh ]]; then
            bash ci-driver/ci/windows/build-diagnostic.sh finish "$CI_WORK"
          else
            df -h
            free -m
          fi
      - name: Upload logs and measurements (including failures)
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vlc-ci1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_WORK }}/logs/
            ${{ env.CI_WORK }}/metrics/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
          overwrite: false
      - name: Export synthetic fixture inputs for native worker tests
        if: ${{ (inputs.stage == '2.4.6B' || inputs.stage == '2.4.6C' || inputs.stage == '2.4.6D' || inputs.stage == '2.4.6E' || inputs.stage == '2.4.6F') && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage${{ inputs.stage == '2.4.6F' && '246F' || inputs.stage == '2.4.6E' && '246E' || inputs.stage == '2.4.6D' && '246D' || inputs.stage == '2.4.6C' && '246C' || '246B' }}-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_WORK }}/fixtures/*.mp4
            ${{ env.CI_WORK }}/fixtures/*.mkv
            ${{ env.CI_WORK }}/fixtures/hevc/*.mp4
            ${{ env.CI_WORK }}/fixtures/hevc/*.mkv
          retention-days: 14
          overwrite: false
      - name: Pilot summary
        if: always()
        shell: bash
        env:
          PACKAGE_URL: ${{ steps.package.outputs.artifact-url }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "CI-1 job status: $JOB_STATUS"
            echo "Source: $SOURCE_SHA"
            echo "Package: ${PACKAGE_URL:-not produced}"
            echo "Evidence: ${EVIDENCE_URL:-not produced}"
            echo 'Download the package artifact, then run: sha256sum -c SHA256SUMS'
            echo 'This pilot does not publish Releases or establish native Windows GUI/PTS accuracy.'
            if [[ -f "$CI_WORK/metrics/summary.json" ]]; then
              echo '```json'
              cat "$CI_WORK/metrics/summary.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  libmpv-experiment:
    if: ${{ !inputs.offline_prototype_only && !inputs.portable_dependency_only && inputs.stage == '2.4.6A' }}
    uses: ./.github/workflows/libmpv-preview-experiment.yml

  native-mpv:
    if: ${{ !inputs.offline_prototype_only && !inputs.portable_dependency_only && !cancelled() && (inputs.stage == '2.4.6B' || inputs.stage == '2.4.6C' || inputs.stage == '2.4.6D' || inputs.stage == '2.4.6E' || inputs.stage == '2.4.6F') && (needs.build.result == 'success' || (inputs.native_only && inputs.package_run_id != '')) }}
    permissions:
      contents: read
      actions: read
    needs: build
    env:
      VLC_CI_STAGE: ${{ inputs.stage }}
      EXPECTED_SOURCE: ${{ inputs.stage == '2.4.6F' && 'e29d1dc98c01e64de60de0fe2f299acd2af57aca' || inputs.stage == '2.4.6E' && 'e577355ed22aea9d2703aad794f79a68f0a1ce42' || inputs.stage == '2.4.6D' && '12b25af9272193ddfd0c298e1e9f48c5ff5b66e4' || inputs.stage == '2.4.6C' && 'febfd332f4ffbc94981f0b1cac298dc941de057b' || '5cfebdb9718b3477e17c5ffcb6d14a2876974350' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run_id || github.run_id }}
          pattern: vlc-stage${{ inputs.stage == '2.4.6F' && '246F' || inputs.stage == '2.4.6E' && '246E' || inputs.stage == '2.4.6D' && '246D' || inputs.stage == '2.4.6C' && '246C' || '246B' }}-win64-*
          path: delivery
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run_id || github.run_id }}
          pattern: stage${{ inputs.stage == '2.4.6F' && '246F' || inputs.stage == '2.4.6E' && '246E' || inputs.stage == '2.4.6D' && '246D' || inputs.stage == '2.4.6C' && '246C' || '246B' }}-fixtures-*
          merge-multiple: true
          path: fixtures
      - name: Verify package, initialize private runtime and exercise persistent worker
        shell: pwsh
        run: |
          $manifest=Get-Content delivery/PACKAGE_MANIFEST.json -Raw | ConvertFrom-Json
          Write-Output ("::notice title=Stage 2.4.6B package::"+($manifest | ConvertTo-Json -Compress))
          if($manifest.source_commit -ne $env:EXPECTED_SOURCE){throw 'Unexpected application source'}
          $zip=Join-Path delivery $manifest.zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.sha256){throw 'ZIP checksum mismatch'}
          7z x "-o$env:RUNNER_TEMP/app" $zip | Out-Null
          if($LASTEXITCODE -ne 0){throw 'ZIP extraction failed'}
          $app=Join-Path "$env:RUNNER_TEMP/app" $manifest.root
          if($env:VLC_CI_STAGE -eq '2.4.6F'){
            $spaced=Join-Path $env:RUNNER_TEMP 'Stage F portable path with spaces'
            Move-Item -LiteralPath $app -Destination $spaced
            $app=$spaced
          }
          & "$app/thumbnail-mpv/Setup-Runtime.ps1" -Destination "$env:RUNNER_TEMP/mpv-runtime"
          if(Test-Path C:/VulkanSDK){Get-ChildItem C:/VulkanSDK -Directory | ForEach-Object {$env:PATH="$($_.FullName)/Bin;$env:PATH"}}
          if($env:VLC_CI_STAGE -eq '2.4.6F'){
            try { & ./test/ci/portable-launcher.ps1 -Application $app }
            catch {
              $detail=($_ | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Stage F launcher check::$detail"
              throw
            }
          }
          if($env:VLC_CI_STAGE -in @('2.4.6C','2.4.6D','2.4.6E','2.4.6F')){
            python prototypes/stage_2_4_6C/benchmark.py --fast "$env:RUNNER_TEMP/mpv-runtime/mpv-thumbnail-worker.exe" --exact "$env:RUNNER_TEMP/mpv-runtime/mpv-thumbnail-accurate-worker.exe" --libvlc "$app/thumbnail-preview/thumbnail-helper.exe" --fixtures fixtures --output results
          }else{
          python prototypes/stage_2_4_6B/test_worker.py "$env:RUNNER_TEMP/mpv-runtime/mpv-thumbnail-worker.exe" fixtures results --libvlc "$app/thumbnail-preview/thumbnail-helper.exe"
          }
          $testExit=$LASTEXITCODE
          if($env:VLC_CI_STAGE -notin @('2.4.6C','2.4.6D','2.4.6E','2.4.6F') -and (Test-Path results/results.json)){
            $r=Get-Content results/results.json -Raw | ConvertFrom-Json
            $summary=@{first=$r.first;warm=$r.warm;matched_warm_mpv=$r.matched_warm_mpv;libvlc_first=$r.libvlc_first;libvlc_warm=$r.libvlc_warm;render=$r.render;previous_pipe_write=$r.previous_pipe_write;max_sampled_private_bytes=$r.max_sampled_private_bytes;cpu_ms_by_media=$r.cpu_ms_by_media;failures=$r.failures;rows=$r.rows.Count;physical_display_verified=$false}
            Write-Output ("::notice title=Stage 2.4.6B synthetic worker::"+($summary | ConvertTo-Json -Compress -Depth 5))
          }
          if($testExit -ne 0){throw 'Native worker test failed'}
          # Launch the fresh VLC executable without a GUI: this is not popup/device acceptance.
          $p=Start-Process "$app/vlc.exe" -ArgumentList '--no-one-instance','--intf=dummy','--vout=dummy','--aout=dummy','--play-and-exit',('"'+(Resolve-Path fixtures/ordinary.mp4).Path+'"') -PassThru
          if(-not $p.WaitForExit(45000)){$p.Kill();throw 'VLC process launch/exit timeout'}
          if($p.ExitCode -ne 0){throw "VLC process exit $($p.ExitCode)"}
          if($env:VLC_CI_STAGE -in @('2.4.6D','2.4.6E','2.4.6F')){
            $smokeOutput=Join-Path (Resolve-Path results).Path "qt-stability-smoke"
            & ./test/modules/gui/qt/stability-smoke.ps1 -Application "$app/vlc.exe" -Media (Resolve-Path fixtures/ordinary.mp4).Path -Output $smokeOutput
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stage${{ inputs.stage == '2.4.6F' && '246F' || inputs.stage == '2.4.6E' && '246E' || inputs.stage == '2.4.6D' && '246D' || inputs.stage == '2.4.6C' && '246C' || '246B' }}-native-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
          overwrite: false

  image-evidence:
    needs: native-mpv
    if: ${{ !inputs.offline_prototype_only && !inputs.portable_dependency_only && !cancelled() && ((inputs.stage == '2.4.6B' && needs.native-mpv.result == 'success') || ((inputs.stage == '2.4.6C' || inputs.stage == '2.4.6D' || inputs.stage == '2.4.6E' || inputs.stage == '2.4.6F') && needs.native-mpv.result != 'skipped')) }}
    permissions:
      contents: read
      actions: read
    env:
      VLC_CI_STAGE: ${{ inputs.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stage${{ inputs.stage == '2.4.6F' && '246F' || inputs.stage == '2.4.6E' && '246E' || inputs.stage == '2.4.6D' && '246D' || inputs.stage == '2.4.6C' && '246C' || '246B' }}-native-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run_id || github.run_id }}
          pattern: stage${{ inputs.stage == '2.4.6F' && '246F' || inputs.stage == '2.4.6E' && '246E' || inputs.stage == '2.4.6D' && '246D' || inputs.stage == '2.4.6C' && '246C' || '246B' }}-fixtures-*
          merge-multiple: true
          path: fixtures
      - name: Analyze visible timestamps independently of seek acknowledgements
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v tesseract >/dev/null; then
            sources=/etc/apt/sources.list.d/ubuntu.sources
            [[ -f "$sources" ]]
            apt_options=(-o "Dir::Etc::sourcelist=$sources" -o 'Dir::Etc::sourceparts=-' -o 'APT::Get::List-Cleanup=0' -o 'DPkg::Lock::Timeout=15' -o 'Acquire::Retries=0' -o 'Acquire::http::Timeout=20' -o 'Acquire::https::Timeout=20')
            timeout 120s sudo apt-get "${apt_options[@]}" update
            timeout 180s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg tesseract-ocr
          fi
          if [[ $VLC_CI_STAGE == 2.4.6C || $VLC_CI_STAGE == 2.4.6D || $VLC_CI_STAGE == 2.4.6E || $VLC_CI_STAGE == 2.4.6F ]]; then
            python3 prototypes/stage_2_4_6C/score_images.py evidence fixtures accuracy
          else
            python3 prototypes/stage_2_4_6B/score_images.py evidence fixtures accuracy
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stage${{ inputs.stage == '2.4.6F' && '246F' || inputs.stage == '2.4.6E' && '246E' || inputs.stage == '2.4.6D' && '246D' || inputs.stage == '2.4.6C' && '246C' || '246B' }}-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: accuracy/
          if-no-files-found: warn
          retention-days: 14
          overwrite: false

  portable-dependencies:
    if: ${{ inputs.portable_dependency_only && !inputs.offline_prototype_only }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out preparatory startup tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Test diagnostics with Windows inbox PowerShell 5.1
        shell: pwsh
        run: |
          $ps=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/ci/portable-vulkan.ps1
          if($LASTEXITCODE -ne 0){throw 'Startup dependency regression tests failed'}
          & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test/ci/portable-vulkan.ps1 -NativeProbe
          if($LASTEXITCODE -ne 0){throw 'Native loader diagnostic test failed'}
      - name: Read existing Stage F inventory metadata (no application binaries)
        id: existing-inventory
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 40221095044
          name: stage-f-inventory-40221095044-1
          path: original-stage-f-inventory
      - name: Encode dependency inventory metadata within annotation limits
        if: ${{ steps.existing-inventory.outcome == 'success' }}
        shell: python
        run: |
          import base64, gzip, json, pathlib
          source = pathlib.Path('original-stage-f-inventory/stage-f-inventory.json')
          data = json.loads(source.read_text())
          files = [{k: row[k] for k in ('filename','size_bytes','sha256','pe_imports')} for row in data['files']]
          payload = base64.b64encode(gzip.compress(json.dumps(files,separators=(',',':')).encode(),mtime=0)).decode()
          pages = [payload[i:i+3400] for i in range(0,len(payload),3400)]
          if len(pages) > 40:
              raise SystemExit('Inventory exceeds metadata transport limit; original artifact remains available')
          pathlib.Path('inventory-pages.json').write_text(json.dumps(pages))
      - name: Inventory metadata group 1
        if: ${{ steps.existing-inventory.outcome == 'success' }}
        shell: python
        run: |
          import json, pathlib
          pages = json.loads(pathlib.Path('inventory-pages.json').read_text())
          for index in range(0,min(10,len(pages))):
              message = json.dumps({'part':index+1,'parts':len(pages),'data':pages[index]},separators=(',',':'))
              print(f'::notice title=Stage F encoded inventory {index+1}/{len(pages)}::'+message)
      - name: Inventory metadata group 2
        if: ${{ steps.existing-inventory.outcome == 'success' }}
        shell: python
        run: |
          import json, pathlib
          pages = json.loads(pathlib.Path('inventory-pages.json').read_text())
          for index in range(10,min(20,len(pages))):
              message = json.dumps({'part':index+1,'parts':len(pages),'data':pages[index]},separators=(',',':'))
              print(f'::notice title=Stage F encoded inventory {index+1}/{len(pages)}::'+message)
      - name: Inventory metadata group 3
        if: ${{ steps.existing-inventory.outcome == 'success' }}
        shell: python
        run: |
          import json, pathlib
          pages = json.loads(pathlib.Path('inventory-pages.json').read_text())
          for index in range(20,min(30,len(pages))):
              message = json.dumps({'part':index+1,'parts':len(pages),'data':pages[index]},separators=(',',':'))
              print(f'::notice title=Stage F encoded inventory {index+1}/{len(pages)}::'+message)
      - name: Inventory metadata group 4
        if: ${{ steps.existing-inventory.outcome == 'success' }}
        shell: python
        run: |
          import json, pathlib
          pages = json.loads(pathlib.Path('inventory-pages.json').read_text())
          for index in range(30,min(40,len(pages))):
              message = json.dumps({'part':index+1,'parts':len(pages),'data':pages[index]},separators=(',',':'))
              print(f'::notice title=Stage F encoded inventory {index+1}/{len(pages)}::'+message)
      - name: Recover published original-provider provenance (read only)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ci/windows/original-runtime-provenance.py original-runtime-provenance.json
      - name: Upload provenance metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-runtime-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: original-runtime-provenance.json
          retention-days: 7
          if-no-files-found: error
          overwrite: false

  offline-prototype:
    if: ${{ inputs.offline_prototype_only }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Compile first-party Unicode bootstrap only
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          mkdir tools-output
          cl /nologo /std:c11 /O2 /W4 /WX /D_CRT_SECURE_NO_WARNINGS extras\package\portable\launcher.c /Fe:"tools-output\Start VLC Timeline Preview.exe" /Fo:tools-output\launcher.obj /link /SUBSYSTEM:WINDOWS user32.lib crypt32.lib
      - name: Test launcher, registration and offline assembly with inbox PowerShell 5.1
        shell: pwsh
        run: |
          $ps=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          function Invoke-InboxTest([string[]]$TestArguments) {
            $PSNativeCommandUseErrorActionPreference=$false
            $details=(& $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File @TestArguments 2>&1 | Out-String)
            $status=$LASTEXITCODE
            Write-Output $details
            if($status -ne 0){
              $safe=$details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows integration regression::$safe"
              throw 'Windows integration test failed'
            }
          }
          Invoke-InboxTest @('test/ci/windows-integration.ps1','-LauncherExecutable','tools-output/Start VLC Timeline Preview.exe')
          Invoke-InboxTest @('test/ci/offline-prototype.ps1')
          Invoke-InboxTest @('test/ci/portable-vulkan.ps1')
          Invoke-InboxTest @('test/ci/portable-vulkan.ps1','-NativeProbe')
      - name: Package first-party tools, source and instructions only
        shell: pwsh
        run: |
          $name='VLC-Timeline-Preview-stage248E-tools-'+$env:GITHUB_SHA.Substring(0,12)
          $root=Join-Path 'delivery' $name
          New-Item -ItemType Directory -Path "$root/portable" -Force | Out-Null
          Copy-Item 'tools-output/Start VLC Timeline Preview.exe' $root
          Copy-Item 'extras/package/portable/*' "$root/portable/"
          Copy-Item COPYING,COPYING.LIB $root
          Copy-Item docs/STAGE_2_4_8E_WINDOWS_INTEGRATION.md "$root/INSTRUCTIONS.md"
          $files=[ordered]@{}
          $full=(Resolve-Path $root).Path
          Get-ChildItem -LiteralPath $root -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative=$_.FullName.Substring($full.Length+1).Replace('\','/')
            if($_.Name -eq 'libmpv-2.dll' -or $_.Extension -eq '.dll'){throw 'Third-party runtime prohibited'}
            $files[$relative]=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{source_commit=$env:GITHUB_SHA;scope='first-party-tools-only';public_binary_runtime=$false;files_sha256=$files} | ConvertTo-Json -Depth 8 | Set-Content "$root/TOOLS_MANIFEST.json" -Encoding utf8
          Compress-Archive -LiteralPath $root -DestinationPath "delivery/$name.zip"
          # Read every entry to verify archive readability before delivery.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path "delivery/$name.zip"))
          try{foreach($entry in $zip.Entries){$stream=$entry.Open();try{$stream.CopyTo([IO.Stream]::Null)}finally{$stream.Dispose()}}}finally{$zip.Dispose()}
          $hash=(Get-FileHash "delivery/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "delivery/$name.zip.sha256" -Encoding ascii
      - name: Upload tools only (never assembled VLC/runtime)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-integration-tools-${{ github.sha }}
          path: |
            delivery/*.zip
            delivery/*.sha256
          retention-days: 14
          if-no-files-found: error
          overwrite: false
